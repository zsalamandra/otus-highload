events {}

http {
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    upstream backend {
        # round-robin по умолчанию
        server z-social-network-hw9-app-1:8085;
        server z-social-network-hw9-app-2:8085;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://backend;

            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_connect_timeout 3s;
            proxy_send_timeout 5s;
            proxy_read_timeout 5s;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # передаём Authorization заголовок явно (если потеряется)
            proxy_set_header Authorization $http_authorization;

            # для отладки — вернём JWT в заголовке (можно удалить)
            add_header X-Debug-TOKEN $http_authorization always;
        }
    }
}
