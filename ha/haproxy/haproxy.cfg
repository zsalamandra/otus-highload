global
    maxconn 100

defaults
    mode tcp
    timeout connect 5s
    timeout client  30s
    timeout server  30s

frontend postgres_read
    bind *:5001
    default_backend read_replicas

backend read_replicas
    balance roundrobin
    server slave1 z-social-network-hw9-postgres-slave-1:5432 check
    server slave2 z-social-network-hw9-postgres-slave-2:5432 check
